# Send traffic from the Istio ingress gateway to the frontend in oia-dev.
# Path: istio-ingressgateway -> frontend -> backend (all inside the mesh, all in Kiali)
apiVersion: networking.istio.io/v1
kind: Gateway
metadata:
  name: oia-gateway
  namespace: oia-dev
spec:
  selector:
    istio: ingressgateway
  servers:
    - port:
        number: 80
        name: http
        protocol: HTTP
      hosts: ["*"]
---
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: frontend
  namespace: oia-dev
spec:
  hosts: ["*"]
  gateways: [oia-gateway]
  http:
    - route:
        - destination:
            host: frontend
            port:
              number: 80
