# nginx (TLS, Let's Encrypt) -> istio-ingressgateway :30080 (plain http) -> pick service by host name
#
#   oia.kst-devops.com     -> frontend     (oia-dev)
#   argocd.kst-devops.com  -> argocd-server (argocd)

apiVersion: networking.istio.io/v1
kind: Gateway
metadata:
  name: public
  namespace: istio-system
spec:
  selector:
    istio: ingressgateway
  servers:
    - port:
        number: 80
        name: http
        protocol: HTTP
      hosts:
        - oia.kst-devops.com
        - argocd.kst-devops.com
---
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: oia
  namespace: oia-dev
spec:
  hosts: [oia.kst-devops.com]
  gateways: [istio-system/public]
  http:
    - route:
        - destination:
            host: frontend
            port:
              number: 80
---
# Argo CD runs in "insecure" mode (plain http) because nginx already does TLS.
# (set by ansible/argocd.yml)
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: argocd
  namespace: argocd
spec:
  hosts: [argocd.kst-devops.com]
  gateways: [istio-system/public]
  http:
    - route:
        - destination:
            host: argocd-server
            port:
              number: 80
