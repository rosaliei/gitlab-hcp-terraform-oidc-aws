# istioctl install -f istio/istio.yaml -y
apiVersion: install.istio.io/v1alpha1
kind: IstioOperator
spec:
  # demo = istiod + ingress gateway + egress gateway, 100% tracing, access logs.
  # Good for showing everything, too heavy / too open for prod.
  profile: demo

  values:
    gateways:
      istio-ingressgateway:
        # RKE2 on EC2 has no cloud LoadBalancer controller, a LoadBalancer
        # service would stay <pending>. NodePort works, and port-forward too.
        type: NodePort
