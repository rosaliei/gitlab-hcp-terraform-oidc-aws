# Dynamic inventory: asks AWS which servers exist, every time you run ansible.
# Groups come from the "Role" tag that Terraform puts on each server.
plugin: amazon.aws.aws_ec2

regions:
  - ap-southeast-1

filters:
  instance-state-name: running
  tag:Role:
    - jump
    - nginx
    - rke2-master
    - rke2-worker

# Host name in ansible = the Name tag (e.g. instance-rke2-master-1)
hostnames:
  - tag:Name

# Which IP ansible connects to: jump = public IP, everything else = private IP
compose:
  ansible_host: public_ip_address if tags.Role == 'jump' else private_ip_address

# Group names the lablabs.rke2 role expects: masters, workers, k8s_cluster
groups:
  jump: tags.Role == 'jump'
  nginx: tags.Role == 'nginx'
  masters: tags.Role == 'rke2-master'
  workers: tags.Role == 'rke2-worker'
  k8s_cluster: tags.Role in ['rke2-master', 'rke2-worker']
