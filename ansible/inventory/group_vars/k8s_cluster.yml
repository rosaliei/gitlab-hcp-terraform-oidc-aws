# Settings for the lablabs.rke2 role
rke2_version: v1.35.1+rke2r1

# Same secret on every node. Set it before running:  export RKE2_TOKEN=...
rke2_token: "{{ lookup('env', 'RKE2_TOKEN') }}"

# 3 masters = HA. nginx is our load balancer, so no keepalived / kube-vip.
rke2_ha_mode: true
rke2_ha_mode_keepalived: false
rke2_ha_mode_kubevip: false
rke2_api_ip: 10.0.1.203   # nginx private IP

# Extra names/IPs allowed in the API certificate
rke2_additional_sans:
  - 10.0.1.203      # nginx private IP
  - 52.221.210.87   # nginx public IP

rke2_cni: [canal]
rke2_ingress_controller: ingress-nginx

# Copy kubeconfig to this folder after install
rke2_download_kubeconf: true
rke2_download_kubeconf_path: "{{ playbook_dir }}"
rke2_download_kubeconf_file_name: kubeconfig.yaml
