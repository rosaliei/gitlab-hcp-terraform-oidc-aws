# One Argo CD app per environment. Each one watches gitops/envs/<env> on main.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: oia-dev
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/rosaliei/gitlab-hcp-terraform-oidc-aws.git
    targetRevision: main
    path: gitops/envs/dev
  destination:
    server: https://kubernetes.default.svc
    namespace: oia-dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    managedNamespaceMetadata:
      labels:
        istio-injection: enabled # Istio adds a sidecar to every pod in this namespace
---
